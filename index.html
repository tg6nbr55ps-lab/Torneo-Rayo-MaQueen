function buildDoc(state){
  var reset=RESET_FALLBACK,styles=document.head.querySelectorAll('style');
  for(var i=0;i<styles.length;i++){
    var tx=styles[i].textContent||'';
    if(tx.indexOf('[hidden]')>-1){reset=tx;break;}
  }
  var css=$('pagecss').textContent;
  var code=$('code').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var S1='<scr'+'ipt',S2='</scr'+'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +HEAD_HTML+'<style id="pagecss">'+css+'</style><div id="app"></div>'
    +S1+' type="application/json" id="data">'+json+S2
    +S1+' id="code">'+code+S2
    +'</body></html>';
}
function doPublish(){
  if(ui.busy||!art||!canEdit)return;
  ui.busy=true;updateBar();
  var html;
  try{html=buildDoc(S);}catch(e){ui.busy=false;updateBar();flash('No se pudo preparar la publicación.');return;}
  art.publish(html).then(function(){
    flash('Publicado. Actualizando…');
  },function(err){
    ui.busy=false;
    var c=err&&err.code;
    if(c==='conflict'){flash('Había una versión más nueva. Se recarga la página.');}
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){canEdit=false;renderAll();flash('Esta vista es de solo lectura.');}
    else if(c==='rate_limited'){flash('Esperá unos segundos y probá de nuevo.');}
    else{flash('No se pudo publicar. Probá de nuevo.');}
    updateBar();
  });
}

/* ---------- small UI helpers ---------- */
function flash(msg){
  var t=$('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3400);
}
function ball(og){
  return '<svg class="ic'+(og?' og':'')+'" viewBox="0 0 16 16" role="img" aria-label="'+(og?'Gol en contra':'Gol')+'"><circle cx="8" cy="8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5l2.7 2-1 3.1H6.3l-1-3.1z" fill="currentColor"/></svg>';
}
function evIcon(e){
  if(e.t==='y')return '<span class="ci y" role="img" aria-label="Amarilla"></span>';
  if(e.t==='r')return '<span class="ci r" role="img" aria-label="Roja"></span>';
  return ball(e.t==='og');
}
function scoreHTML(m){
  return played(m)?'<b>'+m.hg+'</b><i>–</i><b>'+m.ag+'</b>':'<span class="vs">vs</span>';
}
function hintHTML(m){
  var a=assigned(S,m);
  var any=(m.ev||[]).some(function(e){return e.t==='g'||e.t==='og';});
  if(!played(m)&&!any)return '';
  var hg=num(m.hg)?m.hg:0,ag=num(m.ag)?m.ag:0;
  var ok=a.h===hg&&a.a===ag;
  return '<span class="'+(ok?'ok':'warn')+'">Goles con autor: '+a.h+' de '+hg+' (local) · '+a.a+' de '+ag+' (visitante)</span>';
}
function patchMatch(m){
  var sc=document.querySelector('.msc[data-for="'+m.id+'"]');
  if(sc)sc.innerHTML=scoreHTML(m);
  var hn=document.querySelector('.hint[data-for="'+m.id+'"]');
  if(hn)hn.innerHTML=hintHTML(m);
}

/* ---------- chrome: hero, nav, bar ---------- */
function updateHero(){
  var p=S.matches.filter(played).length,t=S.matches.length;
  $('stats').textContent=S.teams.length+' equipos · '+plural(S.players.length,'jugador')+' · '+(t?p+' de '+t+' partidos jugados':'sin partidos cargados');
  $('chip').hidden=!canEdit;
}
function renderNav(){
  $('navin').innerHTML=TABS.map(function(t){
    return '<button type="button" data-act="tab" data-tab="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>';
  }).join('');
}
function updateBar(){
  var show=canEdit&&dirty();
  $('bar').hidden=!show;
  $('barmsg').textContent=ui.busy?'Publicando…':(ui.confirm==='discard'?'¿Descartar todos los cambios?':'Cambios sin publicar');
  $('bpub').disabled=ui.busy;
  $('bdisc').textContent=ui.confirm==='discard'?'Sí, descartar':'Descartar';
}

function teamOpts(sel){
  return S.teams.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+'</option>';}).join('');
}
function playerOpts(m){
  var h='<option value="">Jugador…</option>';
  [m.home,m.away].forEach(function(tid){
    var ps=S.players.filter(function(p){return p.team===tid;}).sort(sortPlayers);
    if(!ps.length)return;
    h+='<optgroup label="'+esc(tname(S,tid))+'">'+ps.map(function(p){
      return '<option value="'+esc(p.id)+'">'+(num(p.num)?p.num+' · ':'')+esc(p.name)+'</option>';
    }).join('')+'</optgroup>';
  });
  return h;
}
function evLine(e,side){
  var p=byId(S.players,e.p);if(!p)return '';
  var txt=esc(p.name)+(e.t==='og'?' <em>(e/c)</em>':'')+(num(e.m)?' <small>'+e.m+'\'</small>':'');
  var ic=evIcon(e);
  return '<li>'+(side==='h'?'<span>'+txt+'</span>'+ic:ic+'<span>'+txt+'</span>')+'</li>';
}
function eventsHTML(m){
  var evs=(m.ev||[]).slice().sort(sortEv);
  if(!evs.length)return '';
  var L='',R='';
  evs.forEach(function(e){
    var p=byId(S.players,e.p);if(!p)return;
    if(p.team===m.away)R+=evLine(e,'a');else L+=evLine(e,'h');
  });
  return '<div class="evs"><ul class="eh">'+L+'</ul><span></span><ul class="ea">'+R+'</ul></div>';
}

    h+='<button type="button" class="btn ghost sm" data-act="open" data-id="'+esc(m.id)+'">'+(open?'Cerrar edición':'Cargar resultado')+'</button>';

/* ---------- editing ---------- */
function onField(e){
  var el=e.target;
  if(!el||!el.getAttribute||!canEdit)return;
  var b=el.getAttribute('data-b');
  if(!b)return;
  var id=el.getAttribute('data-id'),v=el.value,ch=false,m,p,t;
  if(b==='tn'){t=byId(S.teams,id);if(t&&v.trim()){t.name=v.trim().slice(0,30);ch=true;}}
  else if(b==='pn'){p=byId(S.players,id);if(p&&v.trim()){p.name=v.trim().slice(0,40);ch=true;}}
  else if(b==='pu'){p=byId(S.players,id);if(p){p.num=clampInt(v,0,99);ch=true;}}
  else if(b==='ms'){
    m=byId(S.matches,id);
    if(m){var val=clampInt(v,0,99);if(el.getAttribute('data-side')==='h')m.hg=val;else m.ag=val;patchMatch(m);ch=true;}
  }
  else if(e.type==='change'&&(b==='mh'||b==='ma')){
    m=byId(S.matches,id);
    if(m){
      if(b==='mh'&&v!==m.away)m.home=v;
      else if(b==='ma'&&v!==m.home)m.away=v;
      else flash('Local y visitante tienen que ser distintos.');
      ch=true;renderMain();
    }
  }
  else if(e.type==='change'&&b==='mr'){
    m=byId(S.matches,id);var r=clampInt(v,1,99);
    if(m&&r!==null){m.round=r;ch=true;}
    renderMain();
  }
  if(ch){saveDraft();updateBar();updateHero();}
}

function act(a,el){
  if(a==='tab'){
    var tb=el.getAttribute('data-tab');
    ui.tab=tb;ui.confirm='';
    renderNav();renderMain();updateBar();
    window.scrollTo(0,0);
    try{if(location.hash!=='#'+tb)location.hash=tb;}catch(e){}
    return;
  }
  if(!canEdit)return;
  if(a!=='delm'&&a!=='delp'&&a!=='discard')ui.confirm='';
  var id=el.getAttribute('data-id'),m,box;
  var changed=false;
  switch(a){
    case 'gen':
      if(!S.matches.length){
        S.matches=makeFixture(S.teams).map(function(f){return {id:uid('m'),round:f.round,home:f.home,away:f.away,hg:null,ag:null,ev:[]};});
        changed=true;renderMain();
      }
      break;
    case 'addm':
      box=el.closest('.addm');
      var hh=box.querySelector('[data-f="h"]').value,aa=box.querySelector('[data-f="a"]').value,rr=clampInt(box.querySelector('[data-f="r"]').value,1,99);
      if(!hh||!aa||hh===aa){flash('Elegí dos equipos distintos.');break;}
      if(rr===null){rr=1;S.matches.forEach(function(x){if(x.round>rr)rr=x.round;});}
      var nm={id:uid('m'),round:rr,home:hh,away:aa,hg:null,ag:null,ev:[]};
      S.matches.push(nm);ui.open=nm.id;changed=true;renderMain();
      break;
    case 'open':
      ui.open=ui.open===id?null:id;renderMain();
      break;
    case 'clr':
      m=byId(S.matches,id);if(m){m.hg=null;m.ag=null;changed=true;renderMain();}
      break;
    case 'addev':
      m=byId(S.matches,id);box=el.closest('.eadd');
      var tt=box.querySelector('[data-f="t"]').value,pp=box.querySelector('[data-f="p"]').value,mi=clampInt(box.querySelector('[data-f="m"]').value,1,130);
      if(!m)break;
      if(!pp){flash('Elegí un jugador.');break;}
      m.ev.push({id:uid('e'),t:tt,p:pp,m:mi});
      ui.evType=tt;changed=true;renderMain();
      break;
    case 'delev':
      m=byId(S.matches,el.getAttribute('data-mid'));
      if(m){m.ev=m.ev.filter(function(e){return e.id!==id;});changed=true;renderMain();}
      break;
    case 'delm':
      if(ui.confirm==='m:'+id){
        S.matches=S.matches.filter(function(x){return x.id!==id;});
        ui.open=null;ui.confirm='';changed=true;
      }else{ui.confirm='m:'+id;}
      renderMain();
      break;
    case 'addp':
      box=el.closest('.padd');
      var nn=box.querySelector('[data-f="n"]').value.trim(),nu=clampInt(box.querySelector('[data-f="u"]').value,0,99);
      if(!nn){flash('Escribí el nombre del jugador.');break;}
      S.players.push({id:uid('p'),team:id,name:nn.slice(0,40),num:nu});
      changed=true;renderMain();
      break;
    case 'delp':
      if(ui.confirm==='p:'+id){
        S.players=S.players.filter(function(x){return x.id!==id;});
        S.matches.forEach(function(x){x.ev=x.ev.filter(function(e){return e.p!==id;});});
        ui.confirm='';changed=true;
      }else{ui.confirm='p:'+id;}
      renderMain();
      break;
    case 'discard':
      if(ui.confirm==='discard'){
        S=clone(PUB);S.matches.forEach(function(x){if(!x.ev)x.ev=[];});
        ui.confirm='';ui.open=null;changed=true;renderMain();
      }else{ui.confirm='discard';}
      break;
    case 'pub':
      doPublish();
      break;
  }
  if(changed)saveDraft();
  updateBar();updateHero();
}

function tabFromHash(){
  var h=(location.hash||'').replace('#','');
  for(var i=0;i<TABS.length;i++){if(TABS[i][0]===h)return h;}
  return null;
}
var t0=tabFromHash();if(t0)ui.tab=t0;
window.addEventListener('hashchange',function(){
  var t=tabFromHash();
  if(t&&t!==ui.tab){ui.tab=t;ui.confirm='';renderNav();renderMain();updateBar();window.scrollTo(0,0);}
});

if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    art=r[0];
    if(!art||!r[1])return false;
    return r[1].canEdit();
  }).then(function(ok){
    if(ok===true&&art){
      canEdit=true;
      var d=loadDraft();
      if(d){S=d;S.matches.forEach(function(x){if(!x.ev)x.ev=[];});}
      renderAll();
    }
  }).catch(function(){});
}
})();
